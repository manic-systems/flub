name: Tag and Release

on:
  workflow_dispatch:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release
    permissions:
      contents: write
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@23a06db817dba5ff9dee828279eb3070f405d9e1 # v2.3.1
    with:
      stage: prepare
      default-branch: master
      version-command: nix run nixpkgs#fq -- -r .workspace.package.version Cargo.toml

  publish:
    name: Publish
    permissions:
      contents: read
      id-token: write
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true' }}
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@23a06db817dba5ff9dee828279eb3070f405d9e1 # v2.3.1
    with:
      stage: publish
      version: ${{ needs.prepare.outputs.version }}
      install-nix: false
      publish-command: cargo publish --locked --workspace
