name: CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, macos-latest]
    uses: manic-systems/workflows/.github/workflows/rust-checks.yml@d93951cf50722594dc1d64602eb9453dc7da2fb6 # v2.3.0
    with:
      os: ${{ matrix.os }}
      flake-check: false
      fmt: ${{ matrix.os == 'ubuntu-latest' }}
      clippy: true
      clippy-command: >-
        cargo clippy --locked --workspace --all-targets -- -D warnings &&
        cargo clippy --locked -p flub --no-default-features -- -D warnings &&
        RUSTC_BOOTSTRAP=1 cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      test: true
      test-command: >-
        cargo test --locked --workspace &&
        RUSTC_BOOTSTRAP=1 cargo test --locked --workspace --all-features

  msrv:
    name: MSRV
    uses: manic-systems/workflows/.github/workflows/rust-checks.yml@d93951cf50722594dc1d64602eb9453dc7da2fb6 # v2.3.0
    with:
      os: ubuntu-latest
      install-nix: false
      flake-check: false
      rust-toolchain: 1.88.0
      test: true
      test-command: cargo test --locked --workspace

  build:
    name: Build
    permissions:
      actions: write
      contents: read
    uses: manic-systems/workflows/.github/workflows/nix-checks.yml@d93951cf50722594dc1d64602eb9453dc7da2fb6 # v2.3.0
    with:
      os: ubuntu-latest
      cache: true
      cache-save: true

  actions:
    name: Actions Lint
    uses: manic-systems/workflows/.github/workflows/actions-lint.yml@d93951cf50722594dc1d64602eb9453dc7da2fb6 # v2.3.0

  required:
    name: Required Checks
    if: always()
    needs:
      - checks
      - msrv
      - build
      - actions
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
